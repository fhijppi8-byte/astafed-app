<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استفيد | ASTAFED - تداولك الذكي واستثمارك الآمن</title>
  <meta name="description" content="منصة استفيد للربط بين التحليل المالي الاحترافي وأسواق المال العالمية (الفوركس والذهب).">
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              emerald: '#10b981',
              gold: '#f59e0b',
              dark: '#030712',
              card: '#0f172a',
              cardLight: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- React & ReactDOM & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea, select {
      user-select: text;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b1329;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Company TRC20 Wallet
    const COMPANY_TRC20 = "TLzS2yvg6xaKGrUZzPPR2XVvd5W3WRNu4m";

    // Investment Tiers
    const TIERS = [
      { id: 1, name: "باقة البرونز", minAmount: 100, maxAmount: 199, dailyCap: 4, label: "باقة 100$", color: "from-amber-700 to-amber-900" },
      { id: 2, name: "باقة الفضة", minAmount: 200, maxAmount: 299, dailyCap: 8, label: "باقة 200$", color: "from-slate-400 to-slate-600" },
      { id: 3, name: "باقة الذهب", minAmount: 300, maxAmount: 499, dailyCap: 12, label: "باقة 300$", color: "from-yellow-500 to-amber-600" },
      { id: 4, name: "باقة البلاتينيوم", minAmount: 500, maxAmount: 799, dailyCap: 20, label: "باقة 500$", color: "from-emerald-500 to-teal-700" },
      { id: 5, name: "باقة الماس", minAmount: 800, maxAmount: 999, dailyCap: 30, label: "باقة 800$", color: "from-blue-500 to-indigo-700" },
      { id: 6, name: "باقة كبار المستثمرين VIP", minAmount: 1000, maxAmount: 99999, dailyCap: 50, label: "باقة 1000$", color: "from-purple-600 to-amber-500" }
    ];

    // Initial Database
    const INITIAL_USERS = [
      {
        id: "admin-master",
        username: "vitamin11",
        email: "vitamin11@astafed.com",
        password: "200336i",
        name: "إدارة منصة استفيد",
        role: "admin",
        balance: 15400,
        profitWallet: 2450,
        packageId: 6,
        referralCode: "ASTA9999",
        joinedDate: "2026-01-01",
        status: "active",
        isDeleted: false,
        totalBonuses: 0,
        withdrawalAddress: COMPANY_TRC20,
        isAddressLocked: true,
        hasRevealedToday: false,
        referredUsers: []
      }
    ];

    // Standalone App Component
    function AstafedStandaloneApp() {
      // LocalStorage Sync
      const [users, setUsers] = useState(() => {
        try {
          const s = localStorage.getItem("astafed_st_users");
          if (s) {
            const parsed = JSON.parse(s);
            if (!parsed.some(u => u.username === "vitamin11")) {
              return [...parsed, INITIAL_USERS[0]];
            }
            return parsed;
          }
        } catch(e){}
        return INITIAL_USERS;
      });

      const [transactions, setTransactions] = useState(() => {
        try {
          const s = localStorage.getItem("astafed_st_tx");
          if (s) return JSON.parse(s);
        } catch(e){}
        return [
          {
            id: "ORD-101",
            userId: "admin-master",
            userName: "إدارة المنصة",
            type: "deposit",
            amount: 500,
            status: "approved",
            date: "2026-10-28",
            time: "14:30",
            method: "USDT_TRC20",
            walletAddress: COMPANY_TRC20,
            note: "إيداع تمويلي أولي للحساب التجميعي"
          }
        ];
      });

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const s = localStorage.getItem("astafed_st_session");
          if (s) return JSON.parse(s);
        } catch(e){}
        return null;
      });

      const [activeTab, setActiveTab] = useState("dashboard");
      const [adminTab, setAdminTab] = useState("stats");
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      const [referralParam, setReferralParam] = useState("");

      // Daily Market State
      const [dailyGrowth, setDailyGrowth] = useState(3.5);
      const [marketOpen, setMarketOpen] = useState(true);
      const [marketNotice, setMarketNotice] = useState("جلسة تداول الفوركس والذهب نشطة ومباشرة");

      // Form States
      const [loginId, setLoginId] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [regName, setRegName] = useState("");
      const [regUsername, setRegUsername] = useState("");
      const [regEmail, setRegEmail] = useState("");
      const [regPass, setRegPass] = useState("");
      const [regTel, setRegTel] = useState("");
      const [regRef, setRegRef] = useState("");
      const [authError, setAuthError] = useState("");

      // Deposit State
      const [depAmount, setDepAmount] = useState(100);
      const [depMethod, setDepMethod] = useState("USDT_TRC20");
      const [depTelegram, setDepTelegram] = useState("");
      const [depSuccessMsg, setDepSuccessMsg] = useState("");

      // Withdraw State
      const [wthAmount, setWthAmount] = useState(20);
      const [wthWallet, setWthWallet] = useState("");
      const [wthMsg, setWthMsg] = useState({ error: "", success: "" });

      // Daily PnL Admin State
      const [adminDollarPnL, setAdminDollarPnL] = useState(120);
      const [adminPnLSummary, setAdminPnLSummary] = useState("صفقات شراء الذهب XAUUSD حققت 220 نقطة ربح مع ارتداد إيجابي على زوج اليورو دولار EURUSD");

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("astafed_st_users", JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem("astafed_st_tx", JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem("astafed_st_session", JSON.stringify(currentUser));
          const fresh = users.find(u => u.id === currentUser.id);
          if (fresh && JSON.stringify(fresh) !== JSON.stringify(currentUser)) {
            setCurrentUser(fresh);
          }
        } else {
          localStorage.removeItem("astafed_st_session");
        }
      }, [currentUser, users]);

      // Detect referral code in URL
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get("ref");
        if (ref) {
          setReferralParam(ref);
          setRegRef(ref.toUpperCase());
          if (!currentUser) {
            setAuthMode("register");
            setShowAuthModal(true);
          }
        }
      }, []);

      // Statistics Calculation
      const stats = useMemo(() => {
        const nonDeleted = users.filter(u => u.role === "user" && !u.isDeleted);
        const activeDepositors = nonDeleted.filter(u => u.balance > 0);
        const nonDepositors = nonDeleted.filter(u => u.balance === 0);
        const suspended = nonDeleted.filter(u => u.status === "suspended");
        const trash = users.filter(u => u.isDeleted);

        const totalBalances = nonDeleted.reduce((s, u) => s + (u.balance || 0), 0);
        const totalProfitWallets = nonDeleted.reduce((s, u) => s + (u.profitWallet || 0), 0);
        
        const realDeposits = transactions.filter(t => t.type === "deposit" && t.status === "approved");
        const pendingDeposits = transactions.filter(t => t.type === "deposit" && t.status === "pending");
        const completedWth = transactions.filter(t => t.type === "withdrawal" && t.status === "completed");
        const pendingWth = transactions.filter(t => t.type === "withdrawal" && t.status === "pending");
        const distributedProfits = transactions.filter(t => t.type === "daily_profit" && t.status === "completed");

        return {
          totalBalances,
          totalProfitWallets,
          activeDepositorsCount: activeDepositors.length,
          nonDepositorsCount: nonDepositors.length,
          suspendedCount: suspended.length,
          trashCount: trash.length,
          realDepositsTotal: realDeposits.reduce((s, t) => s + t.amount, 0),
          realDepositsCount: realDeposits.length,
          pendingDepositsTotal: pendingDeposits.reduce((s, t) => s + t.amount, 0),
          pendingDepositsCount: pendingDeposits.length,
          completedWthTotal: completedWth.reduce((s, t) => s + t.amount, 0),
          completedWthCount: completedWth.length,
          pendingWthTotal: pendingWth.reduce((s, t) => s + t.amount, 0),
          pendingWthCount: pendingWth.length,
          totalProfits: distributedProfits.reduce((s, t) => s + t.amount, 0),
          totalUsers: nonDeleted.length
        };
      }, [users, transactions]);

      // Authentication Actions
      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError("");
        const tid = loginId.trim().toLowerCase();
        const tpass = loginPass.trim();

        if (tid === "vitamin11" || tid === "admin") {
          if (tpass === "200336i") {
            const admin = users.find(u => u.username === "vitamin11") || INITIAL_USERS[0];
            setCurrentUser(admin);
            setActiveTab("admin");
            setShowAuthModal(false);
            return;
          }
        }

        const found = users.find(u => 
          !u.isDeleted && 
          (u.username.toLowerCase() === tid || u.email.toLowerCase() === tid) && 
          u.password === tpass
        );

        if (found) {
          if (found.status === "suspended") {
            setAuthError("تم حظر هذا الحساب من قبل الإدارة");
            return;
          }
          setCurrentUser(found);
          setActiveTab(found.role === "admin" ? "admin" : "dashboard");
          setShowAuthModal(false);
        } else {
          setAuthError("اسم المستخدم أو كلمة المرور غير صحيحة");
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        setAuthError("");
        const uLower = regUsername.trim().toLowerCase();
        const eLower = regEmail.trim().toLowerCase();

        if (users.some(u => !u.isDeleted && u.username.toLowerCase() === uLower)) {
          setAuthError("اسم المستخدم مسجل مسبقاً، اختر اسماً آخر");
          return;
        }

        const refCode = "ASTA" + Math.floor(1000 + Math.random() * 9000);
        const newUser = {
          id: "usr-" + Date.now(),
          name: regName.trim(),
          username: uLower,
          email: eLower,
          password: regPass,
          role: "user",
          balance: 0,
          profitWallet: 0,
          packageId: 1,
          referralCode: refCode,
          referredBy: regRef ? regRef.trim().toUpperCase() : undefined,
          telegramUsername: regTel.trim(),
          joinedDate: new Date().toISOString().split("T")[0],
          status: "active",
          isDeleted: false,
          totalBonuses: 0,
          hasRevealedToday: false,
          withdrawalAddress: "",
          isAddressLocked: false,
          referredUsers: []
        };

        let updated = [...users, newUser];
        if (regRef) {
          const codeUpper = regRef.trim().toUpperCase();
          updated = updated.map(u => {
            if (u.referralCode === codeUpper) {
              const refs = u.referredUsers ? [...u.referredUsers] : [];
              refs.push({ id: newUser.id, name: newUser.name, username: newUser.username, capital: 0 });
              return { ...u, referredUsers: refs };
            }
            return u;
          });
        }

        setUsers(updated);
        setCurrentUser(newUser);
        setActiveTab("dashboard");
        setShowAuthModal(false);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setActiveTab("dashboard");
      };

      // Investor Reveal Daily Profit
      const handleRevealProfit = () => {
        if (!currentUser) return;
        if (!marketOpen) {
          alert("السوق في حالة عطلة حالياً: " + marketNotice);
          return;
        }
        if (currentUser.balance <= 0) {
          alert("رصيدك الحالي 0$. يرجى إيداع باقة لبدء جني الأرباح اليومية");
          return;
        }
        if (currentUser.hasRevealedToday) {
          alert("لقد كشفت أرباح اليوم مسبقاً! انتظر اعتماد صفقات جلسة الغد");
          return;
        }

        const curTier = TIERS.find(t => t.id === currentUser.packageId) || TIERS[0];
        const rawProfit = currentUser.balance * (dailyGrowth / 100);
        const profit = Math.min(rawProfit, curTier.dailyCap);
        const rounded = Math.round(profit * 100) / 100;

        const updatedUser = {
          ...currentUser,
          profitWallet: Math.round((currentUser.profitWallet + rounded) * 100) / 100,
          hasRevealedToday: true
        };

        const tx = {
          id: "PRF-" + Math.floor(10000 + Math.random() * 90000),
          userId: currentUser.id,
          userName: currentUser.name,
          type: "daily_profit",
          amount: rounded,
          status: "completed",
          date: new Date().toISOString().split("T")[0],
          time: "12:00",
          method: "USDT_TRC20",
          note: `أرباح تداول جلسة اليوم بنسبة +${dailyGrowth}% (سقف الباقة $${curTier.dailyCap})`
        };

        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
        setTransactions(prev => [tx, ...prev]);
        setCurrentUser(updatedUser);

        try {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#10b981', '#34d399', '#fbbf24', '#f59e0b']
          });
        } catch(e){}

        alert(`مبارك! حققت اليوم أرباح بقيمة $${rounded.toFixed(2)} تم إضافتها لمحفظة أرباحك القابلة للسحب`);
      };

      // Handle Deposit Submission
      const handleDepositSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const orderId = "ORD-" + Math.floor(10000 + Math.random() * 90000);
        const newTx = {
          id: orderId,
          userId: currentUser.id,
          userName: currentUser.name,
          type: "deposit",
          amount: Number(depAmount),
          status: "pending",
          date: new Date().toISOString().split("T")[0],
          time: new Date().toTimeString().split(" ")[0].substring(0, 5),
          method: depMethod,
          walletAddress: COMPANY_TRC20,
          telegramUsername: depTelegram || currentUser.telegramUsername,
          note: `طلب إيداع باقة $${depAmount} قيد مراجعة وتأكيد الإدارة`
        };

        setTransactions(prev => [newTx, ...prev]);
        setDepSuccessMsg(`تم تقديم طلب الإيداع بنجاح برقم: ${orderId}. سيتم تدقيقه وتفعيل رصيدك خلال دقائق من قبل الإدارة`);
      };

      // Handle Withdrawal Submission
      const handleWithdrawSubmit = (e) => {
        e.preventDefault();
        setWthMsg({ error: "", success: "" });

        if (!currentUser) return;
        const amt = Number(wthAmount);
        if (amt < 10) {
          setWthMsg({ error: "الحد الأدنى للسحب هو 10 دولارات", success: "" });
          return;
        }
        if (amt > currentUser.profitWallet) {
          setWthMsg({ error: `الرصيد المتاح للسحب هو $${currentUser.profitWallet.toFixed(2)} فقط`, success: "" });
          return;
        }

        const wallet = wthWallet.trim() || currentUser.withdrawalAddress;
        if (!wallet || !wallet.startsWith("T") || wallet.length < 26) {
          setWthMsg({ error: "يرجى إدخال عنوان محفظة TRC-20 صحيح يبدأ بحرف T", success: "" });
          return;
        }

        const orderId = "WTH-" + Math.floor(10000 + Math.random() * 90000);
        const newTx = {
          id: orderId,
          userId: currentUser.id,
          userName: currentUser.name,
          type: "withdrawal",
          amount: amt,
          status: "pending",
          date: new Date().toISOString().split("T")[0],
          time: new Date().toTimeString().split(" ")[0].substring(0, 5),
          method: "USDT_TRC20",
          walletAddress: wallet,
          telegramUsername: currentUser.telegramUsername,
          note: `طلب سحب أرباح بقيمة $${amt} قيد المعالجة`
        };

        const updatedUser = {
          ...currentUser,
          profitWallet: Math.max(0, currentUser.profitWallet - amt),
          withdrawalAddress: wallet,
          isAddressLocked: true
        };

        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
        setTransactions(prev => [newTx, ...prev]);
        setCurrentUser(updatedUser);
        setWthMsg({ error: "", success: `تم تسجيل طلب السحب بنجاح برقم: ${orderId}. سيتم إرسال العملات لمحفظتك فوراً` });
      };

      // Admin Actions
      const approveDeposit = (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;

        setUsers(prev => prev.map(u => {
          if (u.id === tx.userId) {
            const newBal = u.balance + tx.amount;
            let matchedTier = 1;
            for (let i = TIERS.length - 1; i >= 0; i--) {
              if (newBal >= TIERS[i].minAmount) {
                matchedTier = TIERS[i].id;
                break;
              }
            }
            return { ...u, balance: newBal, packageId: matchedTier };
          }
          return u;
        }));

        setTransactions(prev => prev.map(t => t.id === txId ? { ...t, status: "approved" } : t));
        alert("تمت الموافقة على الإيداع وإضافة الرصيد للعميل بنجاح!");
      };

      const rejectDeposit = (txId) => {
        setTransactions(prev => prev.map(t => t.id === txId ? { ...t, status: "rejected", note: "تم الرفض لعدم مطابقة التحويل" } : t));
      };

      const approveWithdrawal = (txId) => {
        const hash = "0x" + Math.random().toString(16).substring(2, 34);
        setTransactions(prev => prev.map(t => t.id === txId ? { ...t, status: "completed", txHash: hash } : t));
        alert("تم اعتماد السحب وتأكيده بنجاح!");
      };

      const rejectWithdrawal = (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;
        setUsers(prev => prev.map(u => u.id === tx.userId ? { ...u, profitWallet: u.profitWallet + tx.amount } : u));
        setTransactions(prev => prev.map(t => t.id === txId ? { ...t, status: "rejected", note: "تم الرفض وإعادة الرصيد لصندوق أرباح العميل" } : t));
      };

      const handlePublishPnL = (e) => {
        e.preventDefault();
        const totalCap = stats.totalBalances;
        const growth = totalCap > 0 ? Math.round((adminDollarPnL / totalCap) * 1000) / 10 : 3.5;
        setDailyGrowth(growth);

        // Reset reveal status for all users
        setUsers(prev => prev.map(u => ({ ...u, hasRevealedToday: false })));
        alert(`تم اعتماد ونشر نتيجة صفقات اليوم بنسبة نمو +${growth}% لجميع المستثمرين!`);
      };

      const toggleBanUser = (uid) => {
        setUsers(prev => prev.map(u => {
          if (u.id === uid) {
            const nextStatus = u.status === "suspended" ? "active" : "suspended";
            return { ...u, status: nextStatus };
          }
          return u;
        }));
      };

      const sendBonus = (uid) => {
        const amtStr = prompt("أدخل قيمة المكافأة بالدولار ($):", "25");
        if (!amtStr) return;
        const amt = parseFloat(amtStr);
        if (isNaN(amt) || amt <= 0) return;

        setUsers(prev => prev.map(u => {
          if (u.id === uid) {
            return { ...u, profitWallet: u.profitWallet + amt, totalBonuses: (u.totalBonuses || 0) + amt };
          }
          return u;
        }));

        const tx = {
          id: "BON-" + Math.floor(10000 + Math.random() * 90000),
          userId: uid,
          userName: "مستثمر",
          type: "daily_profit",
          amount: amt,
          status: "completed",
          date: new Date().toISOString().split("T")[0],
          time: "12:00",
          method: "USDT_TRC20",
          note: "مكافأة إدارية تشجيعية خاصة"
        };
        setTransactions(prev => [tx, ...prev]);
        alert(`تم إرسال مكافأة بقيمة $${amt} إلى محفظة أرباح المستثمر بنجاح!`);
      };

      const moveToTrash = (uid) => {
        if (!confirm("هل أنت متأكد من نقل هذا المستخدم لسلة المحذوفات؟")) return;
        setUsers(prev => prev.map(u => u.id === uid ? { ...u, isDeleted: true } : u));
      };

      const restoreFromTrash = (uid) => {
        setUsers(prev => prev.map(u => u.id === uid ? { ...u, isDeleted: false } : u));
      };

      const userTier = useMemo(() => {
        if (!currentUser) return TIERS[0];
        return TIERS.find(t => t.id === currentUser.packageId) || TIERS[0];
      }, [currentUser]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-white">
          {/* Top Bar Header */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">

                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-amber-400 text-sm font-mono font-bold"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-sm shadow-lg shadow-emerald-900/30 transition mt-2"
                    >
                      إنشاء الحساب والبدء
                    </button>
                    <p className="text-center text-xs text-slate-400 pt-1">
                      لديك حساب بالفعل؟{" "}
                      <button
                        type="button"
                        onClick={() => { setAuthMode("login"); setAuthError(""); }}
                        className="text-emerald-400 font-bold hover:underline"
                      >
                        تسجيل الدخول
                      </button>
                    </p>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
            <p>© 2026 استفيد (ASTAFED) - جميع الحقوق محفوظة لأسواق التداول والتحليل المالي الموحد.</p>
          </footer>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AstafedStandaloneApp />);
  </script>
</body>
</html>
